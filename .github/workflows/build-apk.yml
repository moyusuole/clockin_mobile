# 云端打包安卓 APK：push 到 GitHub 后自动构建，无需本地安装任何东西。
# 产物：Actions 运行页 → Artifacts → app-debug-apk（下载解压得 app-debug.apk）
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 手动安装/补齐 Android SDK 35（热更新插件的 AndroidX 依赖要求 compileSdk 35）
      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装依赖 + 同步 web 资源到安卓工程，然后 gradle 打包出 APK。
      - name: Install deps & sync web assets
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
