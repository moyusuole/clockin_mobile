# 云端打包安卓 APK：push 到 GitHub 后自动构建，无需本地安装任何东西。
# 产物：Actions 运行页 → Artifacts → app-debug-apk（下载解压得 app-debug.apk）
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps, build vendor bundle & sync web assets
        run: |
          npm install --no-audit --no-fund
          npm run build:vendor
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Pack web assets and upload to update server
        if: ${{ secrets.UPDATE_SERVER != '' && secrets.UPDATE_TOKEN != '' }}
        run: |
          which zip >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zip)
          cd public && zip -r ../web.zip . && cd ..
          curl -f -F "file=@web.zip" -F "version=${{ github.run_number }}" "${{ secrets.UPDATE_SERVER }}/upload?token=${{ secrets.UPDATE_TOKEN }}"
