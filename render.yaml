# Render 部署配置：Capacitor 热更新自托管服务
# 在 Render 新建 Web Service 时选择 "Use render.yaml" 即可自动读取本配置。
# 部署后：设置环境变量 UPDATE_TOKEN（手动填一个你自定义的字符串，需与 GitHub Secret 一致）。
services:
  - type: web
    name: clockin-update
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node update-server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: UPDATE_TOKEN
        sync: false   # 部署时在 Render 控制台手动填入（和 GitHub 仓库 secret UPDATE_TOKEN 保持一致）
    disk:
      name: updates
      mountPath: /app/updates
      sizeGB: 1
